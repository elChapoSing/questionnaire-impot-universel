}
@media (prefers-color-scheme: dark) {

    --surface: #1b1a23;
    --ink: #f2f0f7;

    --line: #2f2d3b;

    --ok: #5fd39b;
    --bad: #ff8a80;
    --warn: #f2c35b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121118;
  --surface: #1b1a23;
  --ink: #f2f0f7;
  --muted: #a6a2b4;
  --line: #2f2d3b;

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {

  font-family: var(--font-body);

button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }

.progress {

.progress > div {
  height: 100%; width: 0; background: var(--brand-grad); transition: width .35s ease;
}

.app {
  min-height: 100%;

}
.eyebrow {
  font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 18px;
}
h1, h2 {
  font-family: var(--font-display);
  font-weight: 700; line-height: 1.1; letter-spacing: -0.01em;
  margin: 0 0 16px; text-wrap: balance;
}
h1 { font-size: clamp(34px, 7vw, 52px); }
h2 { font-size: clamp(26px, 5.2vw, 38px); }
.lead { color: var(--muted); font-size: 18px; max-width: 54ch; margin: 0 0 32px; }
.help { color: var(--muted); font-size: 16px; max-width: 56ch; margin: 0 0 28px; }
.qnum { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; margin: 0 0 14px; }

.screen { animation: enter .3s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .screen { animation: none; }

.opt {

.opt:hover { border-color: var(--accent); }
.opt:active { transform: scale(.99); }
.key {
  flex: none; display: grid; place-items: center; width: 28px; height: 28px;
  border: 1.5px solid var(--line); border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted);
}
.opt:hover .key { border-color: var(--accent); color: var(--accent); }

.btn {

}
.btn:hover { filter: brightness(1.08); }
.kbd {
  font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px;

.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); filter: none; }
.hint { color: var(--muted); font-size: 14px; margin-top: 14px; }

.picker { max-width: 520px; margin: 0 0 16px; }
.picker-input {

.picker-input:focus { outline: none; border-color: var(--accent); }
.picker-list {

.picker-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; }

.picker-empty { padding: 10px 12px; color: var(--muted); font-size: 15px; }

.back {

.back:hover { color: var(--ink); }

.verdict {
  display: inline-block; font-size: 14px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
  border: 1.5px solid currentColor; margin: 0 0 18px;
}
.verdict.no { color: var(--ok); }
.verdict.yes { color: var(--bad); }
.verdict.maybe { color: var(--warn); }

.recap { list-style: none; margin: 28px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.recap li {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;

.state { flex: none; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1.5px solid currentColor; }
.state.met { color: var(--bad); }
.state.unmet { color: var(--ok); }
.state.unknown { color: var(--warn); }
.state.skipped { color: var(--muted); }

.sources { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); max-width: 60ch; }
.sources p { margin: 0 0 8px; }
.sources ul { margin: 0; padding-left: 18px; }


.brandbar { height: 6px; background: var(--brand-grad); }
.notice { background: var(--surface); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; text-align: center; padding: 8px 16px; }
.notice strong { color: var(--ink); }
.site-foot { max-width: 60ch; margin: 0 auto; padding: 24px 20px 40px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.site-foot strong { color: var(--ink); }
h1, h2 { }
.eyebrow { color: var(--violet); }
.btn:not(.ghost) { background: var(--brand-grad); color: #fff; }

.countrybox { max-width: 560px; margin: 0 0 28px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); border-left-width: 5px; background: var(--surface); font-size: 15px; }

.countrybox p:last-child { margin-bottom: 0; }
.countrybox .cb-title { font-weight: 700; font-size: 16px; }
.countrybox .cb-detail { color: var(--muted); font-size: 14px; }
.countrybox.below { border-left-color: var(--bad); }
.countrybox.debatable { border-left-color: var(--warn); }

.meth { max-width: 68ch; }

.meth .tag.non { color: var(--warn); }
.meth .tbl { overflow-x: auto; }
.footlink { margin: 12px 0 0; font-size: 14px; }
@media (max-width: 420px) {
  .app { padding-top: 40px; }
  .recap li { flex-direction: column; align-items: flex-start; gap: 8px; }
}

function evaluate(answers) {
  var rows = STEPS.map(function (s, i) {
    var a = answers[i];
    var state = a === undefined ? "skipped" : a === "yes" ? "met" : a === "no" ? "unmet" : "unknown";
    return { label: s.label, state: state };
  });
  for (var i = 0; i < STEPS.length; i++) {
    if (answers[i] === STEPS[i].unmet) {
      return { verdict: "no", reason: STEPS[i].reason, rows: rows };
    }
  }
  if (answers.length < STEPS.length) return { verdict: "incomplete", rows: rows };
  var unknown = answers.some(function (a) { return a === "unknown"; });
  return { verdict: unknown ? "maybe" : "yes", rows: rows };
}

function renderStep(i) {
  var step = STEPS[i];

  var opts = step.options.map(function (o, idx) {
    var b = el("button", { class: "opt", type: "button", "data-value": o[1], id: "opt-" + idx }, [
      el("span", { class: "key", text: KEYS[idx] }),

    b.addEventListener("click", function () { choose(i, o[1]); });
    return b;
  });
  var kids = [
    el("p", { class: "qnum", text: "Question " + (i + 1) + " sur " + STEPS.length }),
    el("h2", { text: step.q })
  ];
  if (step.help) kids.push(el("p", { class: "help", text: step.help }));
  if (step.type === "country") kids.push(buildCountryPicker(i));
  kids.push(el("div", { class: "options", role: "group", "aria-label": "Réponses" }, opts));
  if (i > 0) {
    var back = el("button", { class: "back", type: "button", text: "← Question précédente" });
    back.addEventListener("click", function () { answers.length = i - 1; renderStep(i - 1); });
    kids.push(back);
  }
  kids.push(el("p", { class: "hint", text: step.type === "country" ? "Tapez le nom du pays, puis choisissez-le dans la liste (flèches et Entrée)." : "Astuce : appuyez sur A, B ou C pour répondre." }));
  showScreen(el("section", { class: "screen", "data-step": String(i) }, kids));

  }

function buildCountryPicker(i) {
  var wrap = el("div", { class: "picker" });
  var input = el("input", { type: "text", id: "country-input", class: "picker-input", placeholder: "Tapez le nom d'un pays", autocomplete: "off",
    role: "combobox", "aria-expanded": "true", "aria-controls": "country-list", "aria-label": "Pays de résidence fiscale" });
  var list = el("ul", { class: "picker-list", id: "country-list", role: "listbox", "aria-label": "Pays" });
  var shown = [];
  var active = -1;
  function pick(c) { choose(i, countryAnswer(c.code), c.code); }
  function paint() {
    list.innerHTML = "";
    if (!shown.length) {
      list.appendChild(el("li", { class: "picker-empty", text: "Aucun pays trouvé. Utilisez « Je ne sais pas » ci-dessous." }));
      return;
    }
    shown.forEach(function (c, idx) {
      var li = el("li", { role: "option", "aria-selected": idx === active ? "true" : "false", class: "picker-item" + (idx === active ? " active" : ""), text: c.name });
      li.addEventListener("mousedown", function (e) { e.preventDefault(); pick(c); });
      list.appendChild(li);
    });
    var a = list.querySelector(".active");
    if (a) a.scrollIntoView({ block: "nearest" });
  }
  function filter() {
    var q = normalize(input.value);
    shown = q ? COUNTRIES.filter(function (c) { return normalize(c.name).indexOf(q) !== -1; }) : COUNTRIES.slice();
    active = -1;
    paint();
  }
  input.addEventListener("input", filter);
  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); if (shown.length) { active = Math.min(active + 1, shown.length - 1); paint(); } }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (shown.length) { active = Math.max(active - 1, 0); paint(); } }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (active >= 0) pick(shown[active]);
      else if (shown.length === 1) pick(shown[0]);
    }
  });
  wrap.appendChild(input);
  wrap.appendChild(list);
  filter();
  return wrap;
}

function choose(i, value, code) {
  answers = answers.slice(0, i);

      el("li", { text: "Pour chaque pays : barème national progressif, auquel s'ajoute l'impôt local ou la surtaxe nationale quand nous avons pu les sourcer. Les cotisations sociales, la TVA, les taxes foncières, l'impôt sur la fortune et l'imposition du capital ne sont pas comptés." }),
      el("li", { text: "Taux de change : cours de la BCE du 27 juillet 2026 (relayés par Dow Jones). Exceptions signalées pays par pays : le tenge et le dollar taïwanais viennent de cbonds (18 juillet 2026), le rouble (95 pour 1 €) et le riel cambodgien sont supposés. Le niveau de réponse ne change pas dans une fourchette de plus ou moins 15 % sur le change, sauf indication contraire." }),
      el("li", { text: "Les exceptions prévues par des conventions fiscales (par exemple pour les Français résidant à Monaco) ne sont pas modélisées." }),
      el("li", { text: "Le texte ne précise pas non plus si l'écart de 40 % se mesure sur le taux, sur le montant, ou sur l'ensemble des impôts. Nous avons retenu le taux effectif d'impôt sur le revenu, qui est le plus simple à documenter pays par pays." })
    ]),
    el("h3", { text: "Les trois niveaux de réponse" }),
    el("ul", {}, [
      el("li", { text: LEVEL_LABEL.below + " : taux estimé inférieur ou égal à " + fmtRate(LEVEL_LOW) + ". La condition est considérée comme remplie." }),
      el("li", { text: LEVEL_LABEL.debatable + " : taux estimé entre " + fmtRate(LEVEL_LOW) + " et " + fmtRate(LEVEL_HIGH) + ", ou pays pas encore analysé. La condition reste à vérifier. Ces bornes sont un choix de prudence : elles laissent une marge autour du seuil de " + fmtRate(THRESHOLD) + " pour tenir compte des incertitudes de calcul." }),
      el("li", { text: LEVEL_LABEL.above + " : taux estimé supérieur à " + fmtRate(LEVEL_HIGH) + ". La condition est considérée comme non remplie." })
    ]),
    el("h3", { text: "Données par pays et sources" }),
    el("p", { text: "Les sources « officielle » émanent d'une administration fiscale ou d'un ministère. Les sources « non officielle » sont des médias ou des sites juridiques privés : à confirmer auprès des autorités du pays." }),
    table,
    el("h3", { text: "Limites" }),
    el("ul", {}, [
      el("li", { text: "Seuls " + codes.length + " pays sont analysés à ce stade. Tous les autres sont classés « discutable » (non analysés)." }),
      el("li", { text: "Les barèmes changent chaque année. Les chiffres reflètent les textes consultés en 2026." }),
      el("li", { text: "Un taux effectif calculé à un seul niveau de revenu ne dit rien des régimes spéciaux (expatriés, non-domiciliés, zones franches)." }),
      el("li", { text: "Japon : l'impôt local (10 %) n'est pas inclus faute de source. Hongrie : la contribution sociale de 13 % n'est pas comptée. Vietnam : ordre de grandeur uniquement. Émirats : source officielle encore à ajouter." })
    ]),
    back
  ]));
}
function route() {
  if (location.hash === "#methodologie") renderMethodology(); else { answers = []; renderStart(); }
}
window.addEventListener("hashchange", route);

document.addEventListener("keydown", function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var startBtn = document.getElementById("start");
  if (startBtn && e.key === "Enter") { e.preventDefault(); startBtn.click(); return; }
  var rb = document.getElementById("restart");
  if (rb && e.key === "Enter") { e.preventDefault(); rb.click(); return; }
  if (e.target && e.target.tagName === "INPUT") return;
  var stepNode = document.querySelector("[data-step]");
  if (!stepNode) return;
  var idx = KEYS.indexOf(e.key.toUpperCase());
  var opts = stepNode.querySelectorAll(".opt");
  if (idx >= 0 && idx < opts.length) { e.preventDefault(); opts[idx].click(); }
});

route();
</script>
